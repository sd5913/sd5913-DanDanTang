<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10161b" />
    <link rel="icon" href="data:," />
    <title>格子地形与持续挖掘</title>
  </head>
  <body>
    <main class="workbench">
      <header class="page-heading">
        <h1>格子地形与持续挖掘</h1>
        <div class="round-controls">
          <p id="map-size"></p>
          <button id="new-round" type="button" hidden>新开一局</button>
        </div>
      </header>

      <div class="layout">
        <div id="board" class="board" role="region" aria-label="格子地图"></div>

        <aside class="sidebar" aria-label="地图调试面板">
          <section class="goal" aria-labelledby="goal-title">
            <h2 id="goal-title">北端目标</h2>
            <p id="goal-status" aria-live="polite">挖通地形，抵达北端目标区</p>
          </section>

          <section class="readout" aria-labelledby="readout-title">
            <h2 id="readout-title">调试</h2>
            <dl>
              <div><dt>玩家格</dt><dd id="player-cell">—</dd></div>
              <div><dt>玩家段</dt><dd id="chunk-status">—</dd></div>
              <div><dt>绘制段</dt><dd id="visible-chunks">—</dd></div>
              <div><dt>指向格</dt><dd id="hover-cell">—</dd></div>
              <div><dt>网格</dt><dd id="grid-status">显示</dd></div>
            </dl>
            <p id="dig-result" class="dig-result" aria-live="polite">等待挖掘</p>
          </section>

          <section aria-labelledby="controls-title">
            <h2 id="controls-title">操作</h2>
            <dl class="controls">
              <div><dt><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></dt><dd>移动</dd></div>
              <div><dt><kbd>左键</kbd></dt><dd>瞄准挖首格，挖通后可按 WASD 连挖</dd></div>
              <div><dt><kbd>R</kbd></dt><dd>重置地图</dd></div>
              <div><dt><kbd>G</kbd></dt><dd>切换网格</dd></div>
            </dl>
          </section>

          <section id="round-panel" aria-labelledby="round-title" hidden>
            <h2 id="round-title">对局</h2>
            <label class="defense-controls">实验难度 <select id="round-difficulty"></select></label>
            <p id="round-state" aria-live="polite"></p>
            <p id="round-breach" class="dig-result" data-outcome="rejected" role="status" hidden></p>
            <dl>
              <div><dt>生命</dt><dd id="player-hp"></dd></div>
              <div><dt id="round-time-label">下波倒计时</dt><dd id="round-time"></dd></div>
              <div><dt>下波预计</dt><dd id="round-next-count"></dd></div>
              <div><dt>波次</dt><dd id="round-wave"></dd></div>
              <div><dt>进攻压力</dt><dd id="round-pressure"></dd></div>
              <div><dt>强度阶段</dt><dd id="round-stage"></dd></div>
            </dl>
          </section>

          <section id="expedition-panel" aria-labelledby="expedition-title" hidden>
            <h2 id="expedition-title">经营与建造</h2>
            <p>经济 <output id="economy-balance">0</output></p>
            <p>工具 <output id="tool-level">Lv.1</output></p>
            <p>地貌 <output id="expedition-biome">普通地貌</output></p>
            <div class="defense-controls" aria-label="建筑卡">
              <button id="card-wall" type="button" aria-pressed="false"></button>
              <button id="card-tower" type="button" aria-pressed="false"></button>
              <button id="card-economy" type="button" aria-pressed="false"></button>
            </div>
            <div class="defense-controls">
              <button id="make-card" type="button" aria-describedby="card-draw-reason">制造卡牌</button>
              <button id="research-tool" type="button">研发工具</button>
              <button id="rebuild-technology" type="button" hidden>重建科技设施</button>
            </div>
            <p id="card-draw-result" class="card-draw-result" role="status">
              <span id="card-draw-symbol" aria-hidden="true"></span>
              <span id="card-draw-text"></span>
            </p>
            <p id="card-draw-reason" class="card-draw-reason" aria-live="polite"></p>
            <p id="card-draw-summary" class="card-draw-summary"></p>
            <div id="expedition-debug" class="defense-controls" hidden>
              <button id="expedition-spawn" type="button">调试出兵</button>
              <label>同时生成 <select id="expedition-stress-count">
                <option>50</option><option>100</option><option>250</option>
              </select></label>
              <button id="expedition-stress" type="button">压力测试</button>
            </div>
            <p id="expedition-building">—</p>
            <p id="expedition-feedback" class="dig-result" aria-live="polite">请选择建筑卡，或按住左键挖掘</p>
            <p id="build-preview" class="build-preview" role="status" hidden></p>
          </section>

          <section id="defense-panel" aria-labelledby="defense-title" hidden>
            <h2 id="defense-title">P0-B 防御灰盒</h2>
            <p><kbd>B</kbd> 城墙 <kbd>T</kbd> 测试塔 <kbd>X</kbd> 拆除</p>
            <div class="defense-controls">
              <label>数量 <select id="spawn-count">
                <option>1</option><option>4</option><option>10</option><option>50</option><option>100</option><option>250</option>
              </select></label>
              <label>撞墙伤害 <select id="spawn-damage">
                <option>1</option><option>2</option><option>5</option>
              </select></label>
              <button id="spawn-enemies" type="button">南端生成</button>
            </div>
            <label class="contact-test"><input id="test-player-target" type="checkbox" /> 玩家接触测试</label>
            <p id="defense-hover">—</p>
            <p id="defense-stats"></p>
            <p id="defense-combat-stats"></p>
            <p id="defense-feedback" class="dig-result">等待布防或生成敌人</p>
          </section>

          <ul class="legend" aria-label="地图图例">
            <li><span class="swatch empty"></span>空地</li>
            <li><span class="swatch dirt"></span>可挖地形</li>
            <li><span class="swatch rock"></span>不可破坏岩石</li>
            <li><span class="swatch target"></span>目标区</li>
          </ul>
        </aside>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
