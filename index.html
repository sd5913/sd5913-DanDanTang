<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#10161b" />
    <link rel="icon" href="data:," />
    <title>P0-A.1 · 格子地形与持续挖掘</title>
  </head>
  <body>
    <main class="workbench">
      <header class="page-heading">
        <h1>格子地形与持续挖掘</h1>
        <p>P0-A.1 <span aria-hidden="true">/</span> 24 × 32</p>
      </header>

      <div class="layout">
        <div id="board" class="board" role="region" aria-label="格子地图"></div>

        <aside class="sidebar" aria-label="地图调试面板">
          <section class="goal" aria-labelledby="goal-title">
            <h2 id="goal-title">北端目标</h2>
            <p id="goal-status" aria-live="polite">挖通地形，抵达北端目标区</p>
          </section>

          <section class="readout" aria-labelledby="readout-title">
            <h2 id="readout-title">调试</h2>
            <dl>
              <div><dt>玩家格</dt><dd id="player-cell">—</dd></div>
              <div><dt>指向格</dt><dd id="hover-cell">—</dd></div>
              <div><dt>网格</dt><dd id="grid-status">显示</dd></div>
            </dl>
            <p id="dig-result" class="dig-result" aria-live="polite">等待挖掘</p>
          </section>

          <section aria-labelledby="controls-title">
            <h2 id="controls-title">操作</h2>
            <dl class="controls">
              <div><dt><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></dt><dd>移动</dd></div>
              <div><dt><kbd>左键</kbd></dt><dd>按住挖掘相邻格</dd></div>
              <div><dt><kbd>R</kbd></dt><dd>重置地图</dd></div>
              <div><dt><kbd>G</kbd></dt><dd>切换网格</dd></div>
            </dl>
          </section>

          <ul class="legend" aria-label="地图图例">
            <li><span class="swatch empty"></span>空地</li>
            <li><span class="swatch dirt"></span>可挖地形</li>
            <li><span class="swatch rock"></span>不可破坏岩石</li>
            <li><span class="swatch target"></span>目标区</li>
          </ul>
        </aside>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
